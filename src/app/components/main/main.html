<main>
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let producto of productosMostrados">
      <div class="card h-100 shadow-sm border-0 bg-light">
        <img [src]="producto.imagen" class="card-img-top" alt="Producto TecnoMax">
        <div class="card-body d-flex flex-column">
          <span class="badge bg-secondary mb-2 align-self-start">{{ producto.categoria | uppercase }}</span>
          <h5 class="card-title fw-bold">{{ producto.nombre }}</h5>
          
          <div class="mt-auto mb-3">
            <p class="fs-5 mb-0" *ngIf="!producto.enOferta">Precio: S/ {{ producto.precio }}</p>
            <div *ngIf="producto.enOferta">
              <span class="text-decoration-line-through text-muted small">S/ {{ producto.precio }}</span>
              <span class="text-danger fw-bold fs-5 ms-2">Oferta: S/ {{ producto.precioOferta }}</span>
            </div>
          </div>
          
          <div class="bg-white p-2 rounded border">
            <p class="small fw-bold mb-1">Resenas de clientes:</p>
            <div *ngFor="let resena of producto.resenas" class="small">
              <strong>{{ resena.cliente }}</strong> (Valoracion: {{ resena.valoracion }}/5)<br>
              <span class="text-muted">"{{ resena.comentario }}"</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
